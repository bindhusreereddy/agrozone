<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Shopping Cart | Agro-Zone</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Existing dependencies (unchanged) -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.0-2/css/all.min.css">

	<!-- UI-only styles -->
	<style>
		body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f4f6f8;
        }

        /* Header */
        .header {
            background-color: #1f8f3a;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
        }

        /* Page container */
        .page-container {
            max-width: 1100px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: 500;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background-color: #1f8f3a;
            color: white;
        }

        th, td {
            padding: 14px;
            text-align: center;
            vertical-align: middle;
        }

        tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tbody tr:hover {
            background-color: #eef7f0;
        }

        /* Product image */
        .product-img img {
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        /* Qty buttons */
        .button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .cart-qty-plus,
        .cart-qty-minus {
            background-color: #1f8f3a;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .cart-qty-plus:hover,
        .cart-qty-minus:hover {
            background-color: #176e2d;
        }

        .qty {
            width: 50px;
            text-align: center;
        }

        .price {
            width: 80px;
            text-align: center;
        }

        /* Footer / total */
        tfoot td {
            padding-top: 20px;
        }

        .total {
            font-size: 18px;
            font-weight: bold;
            color: #1f8f3a;
        }

        /* Place order button */
        .place-order {
            text-align: center;
            margin-top: 30px;
        }

        .place-order img {
            width: 120px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .place-order img:hover {
            transform: scale(1.08);
        }
	</style>
</head>

<body>

<div class="header">Agro-Zone</div>

<div class="page-container">

	<h2>Shopping Cart</h2>

	<table id="myTable">
		<thead>
		<tr>
			<th>Product</th>
			<th>Name</th>
			<th>Qty</th>
			<th>Price</th>
			<th>Amount</th>
		</tr>
		</thead>

		<tbody>
		<!-- Wheat -->
		<tr>
			<td class="product-img"><img src="wheat.jpg" width="90"></td>
			<td>Wheat Bags</td>
			<td>
				<div class="button-container">
					<button class="cart-qty-plus" type="button">+</button>
					<input type="text" class="qty" value="0">
					<button class="cart-qty-minus" type="button">-</button>
				</div>
			</td>
			<td><input type="text" value="29.99" class="price" disabled></td>
			<td>Rs <span class="amount">0</span></td>
		</tr>

		<!-- Maize -->
		<tr>
			<td class="product-img"><img src="maize.jpg" width="90"></td>
			<td>Maize</td>
			<td>
				<div class="button-container">
					<button class="cart-qty-plus" type="button">+</button>
					<input type="text" class="qty" value="0">
					<button class="cart-qty-minus" type="button">-</button>
				</div>
			</td>
			<td><input type="text" value="65.7" class="price" disabled></td>
			<td>Rs <span class="amount">0</span></td>
		</tr>

		<!-- Rice -->
		<tr>
			<td class="product-img"><img src="rice.jpg" width="90"></td>
			<td>Rice</td>
			<td>
				<div class="button-container">
					<button class="cart-qty-plus" type="button">+</button>
					<input type="text" class="qty" value="0">
					<button class="cart-qty-minus" type="button">-</button>
				</div>
			</td>
			<td><input type="text" value="42" class="price" disabled></td>
			<td>Rs <span class="amount">0</span></td>
		</tr>

		<!-- Onion -->
		<tr>
			<td class="product-img"><img src="onion.jpg" width="90"></td>
			<td>Onion</td>
			<td>
				<div class="button-container">
					<button class="cart-qty-plus" type="button">+</button>
					<input type="text" class="qty" value="0">
					<button class="cart-qty-minus" type="button">-</button>
				</div>
			</td>
			<td><input type="text" value="15" class="price" disabled></td>
			<td>Rs <span class="amount">0</span></td>
		</tr>

		<!-- Sugarcane -->
		<tr>
			<td class="product-img"><img src="sugarcane.jpg" width="90"></td>
			<td>Sugarcane</td>
			<td>
				<div class="button-container">
					<button class="cart-qty-plus" type="button">+</button>
					<input type="text" class="qty" value="0">
					<button class="cart-qty-minus" type="button">-</button>
				</div>
			</td>
			<td><input type="text" value="30" class="price" disabled></td>
			<td>Rs <span class="amount">0</span></td>
		</tr>

		<!-- Cotton -->
		<tr>
			<td class="product-img"><img src="cottton.jpg" width="90"></td>
			<td>Cotton</td>
			<td>
				<div class="button-container">
					<button class="cart-qty-plus" type="button">+</button>
					<input type="text" class="qty" value="0">
					<button class="cart-qty-minus" type="button">-</button>
				</div>
			</td>
			<td><input type="text" value="28.5" class="price" disabled></td>
			<td>Rs <span class="amount">0</span></td>
		</tr>
		</tbody>

		<tfoot>
		<tr>
			<td colspan="4"></td>
			<td><strong>TOTAL = <span id="total" class="total">0</span></strong></td>
		</tr>
		</tfoot>
	</table>

	<div class="place-order">
		<a href="payment.html" onclick="saveBillAmount()">
			<img src="placeorder.jpg" alt="Place Order">
		</a>
	</div>

</div>

<!-- Existing scripts (unchanged) -->
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="./order.js"></script>

</body>
</html>
