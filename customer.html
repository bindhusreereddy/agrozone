<!DOCTYPE html>
<html>
<head>
	<title>Customer | Agro-Zone</title>

	<!-- UI-only styling -->
	<style>
		body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f4f6f8;
        }

        /* Header */
        .header {
            background-color: #1f8f3a;
            color: white;
            padding: 22px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }

        /* Page container */
        .container {
            max-width: 1100px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 500;
            color: #333;
        }

        /* Crop grid */
        .crop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }

        .crop-card {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.12);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            background: #fff;
        }

        .crop-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.18);
        }

        .crop-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        /* Order button */
        .order-btn {
            display: inline-block;
            margin: 40px auto 0;
            padding: 14px 32px;
            background-color: #1f8f3a;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        .order-btn:hover {
            background-color: #176e2d;
        }

        .btn-wrapper {
            text-align: center;
        }
	</style>
</head>
